name: Long
options:
  projectFormat: xcode16_3
  defaultSourceDirectoryType: syncedFolder

packages:
  LucideSwift:
    url: https://github.com/ajaxjiang96/lucide-swift.git
    from: "0.9.11"
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    from: "0.65.1"

targets:
  Long:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        UIAppFonts:
          - JetBrainsMono-Medium.ttf
          - SixCaps-Regular.ttf
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.liamhales.long
      DEVELOPMENT_TEAM: 2D6J3EFWS5
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "6.0"
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: LucideSwift
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
